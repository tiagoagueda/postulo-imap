name: Bug report
about: A message was matched or classified wrongly, or the mailbox reader does not work for you.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Write in whatever language you can; English is easiest for the maintainer to act on, but a report in another language is better than none.

        **Is it a security problem?** Do not post it here, this page is public. Follow [SECURITY.md](https://source.tiagoagueda.com/postulo/postulo/src/branch/main/SECURITY.md).

        **Remove personal details before you paste anything.** Postulo holds CVs, home addresses and the names of the people somebody is applying to. A log or a screenshot is where those leak: blank out names, addresses, e-mail addresses, company and listing details, tokens and cookies first.

        **Do not attach the mail.** A message classified wrongly is the most useful thing to report and the most private: give its subject line and the sender's domain, with names removed, and nothing else from it. The server's address, your username and your password do not belong in a report.
  - type: input
    id: plugin-version
    attributes:
      label: postulo-imap version
      description: "*Server settings → Plugins* lists it."
      placeholder: "0.5.0"
    validations:
      required: true
  - type: input
    id: postulo-version
    attributes:
      label: Postulo version
      description: The foot of every page shows the version. On the `:dev` image, give the pinned tag (`<version>-dev.<short sha>`), because `:dev` moves.
      placeholder: "0.5.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How the plugin is installed
      options:
        - From a catalogue, under Server settings → Plugins
        - A wheel uploaded under Server settings → Plugins
        - Into Postulo's environment by hand (uv pip install)
        - Built into an image of my own
        - Other (say so below)
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Mail provider or server software
      description: Gmail, Fastmail, Outlook.com, Dovecot, or another. Not its address.
      placeholder: Dovecot 2.4
    validations:
      required: true
  - type: input
    id: mail-language
    attributes:
      label: Language the mail was written in
      description: The classification rules are per language, so this decides which phrase list read it; mail in a language with no list is skipped, not guessed at.
      placeholder: Portuguese
  - type: textarea
    id: message
    attributes:
      label: The message it got wrong, if one did
      description: Its subject line and the sender's domain (`example.org`), with names removed. Not the message, and not the sender's address.
      placeholder: |
        Subject: Your application for the role of …
        Sender's domain: example.org
  - type: textarea
    id: steps
    attributes:
      label: What you did, step by step
      placeholder: |
        1. Open ...
        2. Press ...
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: For a message read wrongly, which application it was matched to, or what it was classified as (offer, rejection, invitation, assessment, acknowledgement, nothing).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything from the logs that bears on it, with personal details removed first.
      render: text
