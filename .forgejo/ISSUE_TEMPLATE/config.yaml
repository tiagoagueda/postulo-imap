blank_issues_enabled: true
contact_links:
  - name: A security problem is not a public issue
    url: https://source.tiagoagueda.com/postulo/postulo/src/branch/main/SECURITY.md
    about: Report a vulnerability privately, as SECURITY.md describes. Do not open an issue.
  - name: A wrong or missing translation
    url: https://source.tiagoagueda.com/postulo/postulo-imap/src/branch/main/README.md#translations
    about: Correct a word in Weblate, where this plugin's translations are kept, rather than reporting it here. A missing phrase for classifying mail is a pull request to the phrase lists, as "Adding a language" says.
  - name: A question about using the plugin
    url: https://source.tiagoagueda.com/postulo/postulo-imap/src/branch/main/README.md#use
    about: The README says how to set up the folder and the connection, and what it does with a message.
