# The promises that have to hold in a published version rather than in every commit: the
# twenty-four European Union catalogues complete, and the catalogue tool actually present
# rather than skipped past. `pytest -m release` is what asks for them, and a tag is the
# only thing that asks for it.
#
# Its own workflow rather than a second job in `ci.yml`, because a job carrying `needs:`
# ends the whole run here with "'runs-on' key not defined in CI/test" — the release job
# reported failure on every ordinary push, which is the same red as a real failure. A
# workflow that a branch push does not trigger cannot be red on one.
name: Release gate

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # One version of uv, and the sha256 of that version's install.sh, checked before it is
  # run: the script is the trust root for the uv binary it fetches, and `curl | sh` ran
  # whatever the address answered (postulo/postulo#790, postulo-imap#24). Bump the two
  # together, as the Postulo repository's `ci.yml` does.
  UV_VERSION: "0.12.17"
  UV_INSTALLER_SHA256: "37b82230b28617c6c24fa52364fa28aa37f2aa40c114809a623f6b064a9730e5"

jobs:
  gate:
    runs-on: ubuntu-latest
    container:
      # Node, because Forgejo runs `actions/checkout` as JavaScript inside this container;
      # uv brings its own Python. `ci.yml` says more about why.
      image: node:22-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install WeasyPrint's libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfontconfig1
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" -o /tmp/uv-install.sh
          echo "${UV_INSTALLER_SHA256}  /tmp/uv-install.sh" | sha256sum -c -
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the plugin, Postulo and the test tools
        run: uv sync --locked --python 3.14

      - name: Audit the Python dependencies
        # The lock rather than the installed environment: Postulo is a git dependency, not on
        # PyPI, so it is left out of the export (the core's own audit does the same for
        # itself). `--strict` keeps a dependency that cannot be looked up a failure.
        run: |
          uv export --no-emit-project --no-emit-package postulo --all-groups \
            --format requirements-txt --no-hashes > /tmp/locked-requirements.txt
          uv run --with pip-audit==2.10.1 pip-audit --strict --progress-spinner off \
            -r /tmp/locked-requirements.txt

      - name: The release gate
        run: uv run pytest -m release
