# The tests on the Pythons a pull request does not test (postulo-imap#14).
#
# `ci.yml` runs the tests on the newest Python alone, on every push and pull request.
# `requires-python` admits 3.12 and 3.13 as well, and a plugin is installed into the core's
# environment on whichever of the three it runs, so those two run here instead, the way the
# Postulo repository's own `every-python.yml` does (postulo/postulo#713, #1137): weekly, and
# by themselves on a push to `main` that changes `pyproject.toml` (the version, the declared
# Pythons, the dependencies) or `uv.lock` (the Postulo this plugin is tested against). A
# release changes the version, so its merge runs these legs on the commit that is tagged.
# Pull requests and other branches never: that keeps a pull request as long as it was.
#
# A workflow of its own rather than a matrix in `ci.yml`, because this Forgejo expands a
# matrix before it knows the event, and fails a job whose `if` is false instead of skipping
# it; the Postulo repository's `every-python.yml` says more.
#
# Each leg is the shared plugin CI, Postulo/plugin-ci (postulo/postulo#1170), on that Python;
# `ci.yml` says why it is named by its full address.
name: Every Python

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
  schedule:
    # Mondays, after the Postulo repository's own weekly runs.
    - cron: "17 7 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    container:
      # Node, because Forgejo runs `actions/checkout` as JavaScript inside this container;
      # uv brings its own Python. `ci.yml` says more about why.
      image: node:22-bookworm
    strategy:
      fail-fast: false
      matrix:
        # Every Python `requires-python` admits but the newest, which `ci.yml` runs on
        # every push and pull request.
        python-version: ["3.12", "3.13"]

    # Only what depends on the interpreter: the lint, the audit and the catalogue checks
    # read the same on every Python and stay in `ci.yml`.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Test
        # WeasyPrint's libraries, uv, `uv sync --locked` on this Python, the catalogues
        # compiled (the .mo files are not committed), the tests.
        uses: https://source.tiagoagueda.com/Postulo/plugin-ci@v1
        with:
          python-version: ${{ matrix.python-version }}
          lint: "false"
          catalogues: "false"
        timeout-minutes: 30
