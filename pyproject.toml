[project]
name = "postulo-imap"
version = "0.5.0"
description = "Read one folder of a mailbox over IMAP and suggest what it says happened: acknowledgements, rejections, interview invitations, assessments, offers. Nothing is written on a guess."
readme = "README.md"
requires-python = ">=3.12.4"
license = "AGPL-3.0-or-later"
authors = [{ name = "Tiago Agueda" }]
keywords = ["postulo", "plugin", "imap", "email"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
]
# IMAPClient over the standard library's imaplib: the same protocol, with the responses
# already parsed. Everything else — reading a message, its headers, its text — is the
# standard library's `email`. Postulo itself is not declared: a plugin runs inside
# Postulo's environment, and Postulo is not on PyPI.
dependencies = ["imapclient>=3.0"]

[project.urls]
Homepage = "https://source.tiagoagueda.com/postulo/postulo-imap"
"Postulo" = "https://source.tiagoagueda.com/postulo/postulo"
"Writing a plugin" = "https://source.tiagoagueda.com/postulo/postulo/src/branch/main/docs/PLUGINS.md"

[project.entry-points."postulo.syncs"]
imap = "postulo_imap.sync:ImapSync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postulo_imap"]
# The compiled catalogues: not committed (a translation arriving from Weblate would
# leave a stale one behind), so `postulo-messages compile` writes them before the build
# and this puts them in the wheel, which leaves out what .gitignore names.
artifacts = ["src/postulo_imap/locale/*/LC_MESSAGES/django.mo"]

[dependency-groups]
dev = [
    # The Postulo this plugin is released beside, named exactly rather than left as
    # "whatever `main` is today": a plugin tested against tomorrow's core is not tested
    # against the core anybody is running (postulo-imap#1).
    #
    # A commit of the core while the next release is not tagged: this one holds the state a
    # sync keeps between runs (postulo/postulo#1165). Never a branch; a plugin release moves
    # it to the tag of the Postulo it is released beside (postulo/postulo#1090).
    "postulo @ git+https://source.tiagoagueda.com/postulo/postulo.git@87cb1d4f7471bbcddf7a290146d934da93ce6ac4",
    "pytest>=8.3",
    "pytest-django>=4.14",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]
# The release gate: the twenty-four European Union catalogues complete, run before a tag
# with `uv run pytest -m release`. Postulo's own gate cannot see a plugin's catalogues,
# so each plugin holds its own (postulo/postulo#187).
addopts = "--strict-markers -m 'not release'"
markers = [
    "release: a promise that must hold in a published version, not in every commit",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
